services:
  mcp-outline:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-outline
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - MCP_STREAMABLE_HTTP_PATH=/outline
      - MCP_STATELESS_HTTP=true
      - OUTLINE_REQUIRE_PASSTHROUGH=true
      - OUTLINE_ALLOWED_API_URL_HOSTS=outline.example.com
      - OUTLINE_DEFAULT_API_URL=https://outline.example.com/api
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mcp-outline-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mcp-outline.conf:/etc/nginx/conf.d/default.conf:ro
      # Provide certificate/key files for TLS in production.
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - mcp-outline
    restart: unless-stopped
